android.enableJetifier=false
android.useAndroidX=true
# AGP 9 defaults to creating unit tests only for the tested (debug) build type.
# CI executes both real debug and release unit-test tasks. Do not omit release tests.
android.onlyEnableUnitTestForTheTestedBuildType=false
org.gradle.jvmargs=-Xmx4096m
org.gradle.caching=true
org.gradle.parallel=true
# License report doesn't allow us to enable configuration caching
#org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
